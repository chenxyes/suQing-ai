  <style>
    /* 清透极光玻璃（默认浅色） + 暗夜液态玻璃（深色）双主题 */
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 68% 45% at 12% 0%, rgba(255, 198, 229, 0.42) 0%, transparent 62%),
        radial-gradient(ellipse 58% 42% at 92% 8%, rgba(196, 224, 255, 0.36) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 50% 100%, rgba(255, 232, 244, 0.38) 0%, transparent 65%),
        #FAFBFD;
      transition: background 0.35s ease, color 0.25s ease;
    }
    body.is-dating {
      background:
        radial-gradient(ellipse 75% 48% at 18% 0%, rgba(255, 166, 210, 0.48) 0%, transparent 64%),
        radial-gradient(ellipse 60% 45% at 88% 12%, rgba(255, 214, 178, 0.42) 0%, transparent 60%),
        radial-gradient(ellipse 62% 48% at 50% 100%, rgba(255, 200, 228, 0.42) 0%, transparent 66%),
        #FFF9FC;
    }
    html[data-theme="dark"] body {
      background:
        radial-gradient(ellipse 65% 42% at 15% 0%, rgba(255, 126, 179, 0.16) 0%, transparent 62%),
        radial-gradient(ellipse 58% 40% at 88% 10%, rgba(124, 148, 255, 0.14) 0%, transparent 60%),

      color: #F4F4F6;
    }
    html[data-theme="dark"] body.is-dating {

        radial-gradient(ellipse 72% 46% at 20% 0%, rgba(255, 118, 176, 0.22) 0%, transparent 62%),
        radial-gradient(ellipse 55% 44% at 85% 15%, rgba(251, 166, 128, 0.16) 0%, transparent 60%),
        #0D0A10;
    }
    .pg-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 8px 28px -14px rgba(31, 38, 135, 0.12);
    }
    html[data-theme="dark"] .pg-glass {
      background: rgba(20, 20, 28, 0.74);
      border-color: rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 32px -16px rgba(0, 0, 0, 0.65);
    }
    .bubble-them {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 20px -12px rgba(31, 38, 135, 0.14);
      border-radius: 6px 18px 18px 18px;
      padding: 10px 14px;
      max-width: 82%;
      word-wrap: break-word;
    }
    html[data-theme="dark"] .bubble-them {
      background: rgba(30, 30, 40, 0.88);
      border-color: rgba(255, 255, 255, 0.09);
      color: #F4F4F6;
    }
    .bubble-me {
      background: linear-gradient(135deg, #FF9BC2 0%, #F46AA0 100%);
      color: #fff;
      box-shadow: 0 8px 20px -10px rgba(244, 106, 160, 0.55);
      border-radius: 18px 6px 18px 18px;
      padding: 10px 14px;
      max-width: 82%;
      word-wrap: break-word;
    }
    .typing-dots span { display: inline-block; width: 6px; height: 6px; background: #FF8FB8; border-radius: 50%; margin: 0 2px; animation: typing 1.4s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
    .pill { background: rgba(255, 232, 242, 0.9); color: #E25B90; padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    html[data-theme="dark"] .pill { background: rgba(255, 143, 184, 0.18); color: #FFB6D9; }
    .dock-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; border-radius: 9999px; font-size: 11.5px; font-weight: 600;
      background: rgba(255, 255, 255, 0.78); border: 1px solid rgba(255, 182, 217, 0.42);
      color: #4A4449; cursor: pointer; transition: all 0.16s ease; white-space: nowrap;
    }
    .dock-pill:hover { background: #FFF0F7; border-color: #FF8FB8; color: #E0578A; transform: translateY(-1px); }
    .dock-pill.is-active { background: linear-gradient(135deg, #FF9BC2 0%, #F46AA0 100%); border-color: transparent; color: #fff; }

    .pg-sheet {

  <script>
    const userRaw = localStorage.getItem('xiyu_user');
    const token = localStorage.getItem('xiyu_token');
    if (!userRaw || !token) { location.href = '/app/auth.html'; }
    const companionId = Number(localStorage.getItem('xiyu_companion_id'));
    if (!companionId) { location.href = '/app/dashboard.html'; }

    function authHeaders() {
      return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
    }

    // ─── 清透极光 / 暗夜液态玻璃一键切换 ───────────────────────────────────
    const themeBtn = document.getElementById('btn-pg-theme');
    function syncThemeBtn() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (themeBtn) themeBtn.textContent = isDark ? '🌌 暗夜' : '✨ 极光';
    }
    syncThemeBtn();
    themeBtn?.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('xiyu_theme', next); } catch {}
      syncThemeBtn();
    });

    // ─── 图片压缩 + 鉴权图片加载 + 灯箱 ────────────────────────────────────
    function compressFile(file, maxEdge = 1280) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('读取图片失败'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => resolve(String(reader.result || ''));
          img.onload = () => {
            const ratio = Math.min(1, maxEdge / Math.max(img.width || 1, img.height || 1));
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(img.width * ratio));
            c.height = Math.max(1, Math.round(img.height * ratio));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.88));
          };
          img.src = String(reader.result || '');
        };
        reader.readAsDataURL(file);
      });
    }

    // ─── 发送消息（支持文字 + 送礼图 + 约会背景合影图） ────────────────────
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    let busy = false;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;
      const text = input.value.trim();
      const imgToSend = attachedImage;
      const purposeToSend = attachedPurpose;
      if (!text && !imgToSend) return;

      busy = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '发送中…';
      appendUser(text || (purposeToSend === 'gift' ? '送你这个试试看～' : '我们在这拍张合影吧！'), imgToSend);
      input.value = '';
      input.style.height = 'auto';
      clearAttach();
      showTyping();

      try {
        const r = await fetch('/api/companions/' + companionId + '/playground-chat', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            text: text || (purposeToSend === 'gift' ? '送你这个试试看' : '坐我旁边合个影吧'),
            image: imgToSend || undefined,
            image_purpose: imgToSend ? purposeToSend : undefined,
          }),
        });
        const d = await r.json();
        hideTyping();
        if (!r.ok || !d.ok) throw new Error(d.message || d.error || '请求失败');
        if (d.data?.sleeping) {
          appendSystem('💤 她睡着了，现在是她的睡眠时间。消息已收到，她起床后会回你～');
          return;
        }
        const segs = d.data?.segments || [];
        for (let i = 0; i < segs.length; i++) {
          const seg = segs[i];
          if (i > 0) await new Promise(rr => setTimeout(rr, 320 + Math.random() * 420));
          if (seg.text) appendThem(seg.text);
          for (const s of seg.stickers || []) appendSticker(s);
        }
        updateState(d.data?.state);
        if (d.data?.dateSession) renderDateState(d.data.dateSession);
        else if (d.data?.settledDate) {
          renderDateState(null);
          appendSystem('✨ 本次约会已结算入长期记忆' + (d.data.settledDate.resolvedLoops?.length ? '，并核销关联约定 ' + d.data.settledDate.resolvedLoops.length + ' 条' : ''));
        }

        // 若本轮触发了送礼试穿：自动异步在对话流里显影试穿照！
        if (d.data?.wardrobeAction?.item && d.data.wardrobeAction.shouldSendTryonPhoto) {
          const wItem = d.data.wardrobeAction.item;
          const card = appendDevelopingCard('正在换上「' + wItem.name + '」拍试穿照');
          fetch('/api/companions/' + companionId + '/wardrobe/' + wItem.id + '/tryon', {
            method: 'POST', headers: authHeaders(), body: JSON.stringify({ compose_with_wearing: true }),
          }).then(res => res.json().catch(() => ({}))).then(out => {
            if (out?.ok && out.data?.tryon_image_url) {
              resolveDevelopingCard(card, out.data.tryon_image_url, '👗 已收入数字衣橱 · 「' + wItem.name + '」试穿照');
            } else {
              card.remove();
            }
          }).catch(() => card.remove());
        } else if (d.data?.shouldTriggerCyberPhoto && imgToSend) {
          triggerDatePhotoInChat(imgToSend, text || '开心约会合影');
        } else if (d.data?.shouldTriggerDatePhoto) {
          triggerDatePhotoInChat('', text || '开心约会合影');
        }
      } catch (err) {
        hideTyping();
        appendSystem('❌ ' + err.message);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        sendBtn.textContent = '发送';
        input.focus();
      }
    });

    // ─── 朗读 & 录音 ──────────────────────────────────────────────────────
    let _voiceAudio = null;
    async function playTextAsVoice(text, btnEl) {
      try {
        text = String(text || '').slice(0, 100);
        if (_voiceAudio) { _voiceAudio.pause(); _voiceAudio = null; }
        if (btnEl) btnEl.style.opacity = '0.4';
        const r = await fetch('/api/companions/' + companionId + '/tts-preview', {
          method: 'POST', headers: authHeaders(), body: JSON.stringify({ text }),
        });
        if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ('HTTP ' + r.status)); }
        const url = URL.createObjectURL(await r.blob());
        _voiceAudio = new Audio(url);
        _voiceAudio.onended = _voiceAudio.onerror = () => { if (btnEl) btnEl.style.opacity = ''; };
        await _voiceAudio.play();
      } catch (e) {
        if (btnEl) btnEl.style.opacity = '';
        appendSystem('❌ 朗读失败：' + e.message);
      }
    }

    const micBtn = document.getElementById('mic-btn');
    let mediaRec = null, micChunks = [], micStream = null;
    micBtn.addEventListener('click', async () => {
      if (mediaRec && mediaRec.state === 'recording') { try { mediaRec.stop(); } catch {} return; }
      if (!navigator.mediaDevices?.getUserMedia) { appendSystem('❌ 浏览器不支持麦克风'); return; }
      try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { appendSystem('❌ 无法访问麦克风：' + (e.message || '已拒绝授权')); return; }
      let mime = 'audio/webm;codecs=opus';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'audio/webm';
      if (!MediaRecorder.isTypeSupported(mime)) mime = '';
      mediaRec = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined);
      micChunks = [];
      mediaRec.ondataavailable = e => { if (e.data.size) micChunks.push(e.data); };
      mediaRec.onstop = async () => {
        for (const t of micStream.getTracks()) t.stop();
        const blob = new Blob(micChunks, { type: mediaRec.mimeType || 'audio/webm' });
        micBtn.textContent = '🎙️';
        micBtn.classList.remove('bg-sakura-soft');
        if (blob.size < 300) { appendSystem('录音太短了～'); return; }
        if (blob.size > 1.5 * 1024 * 1024) { appendSystem('录音太长了，请保持在一分钟内'); return; }
        const b64 = await new Promise((res, rej) => {
          const fr = new FileReader();
          fr.onloadend = () => { const s = String(fr.result || ''); res(s.slice(s.indexOf(',') + 1)); };
          fr.onerror = rej;
          fr.readAsDataURL(blob);
        });
        micBtn.disabled = true;
        try {
          const r = await fetch('/api/companions/' + companionId + '/asr-transcribe', {
            method: 'POST', headers: authHeaders(), body: JSON.stringify({ audio_base64: b64, mime: blob.type.split(';')[0] }),
          });
          const d = await r.json();
          if (!r.ok || !d.ok) throw new Error(d.error || '识别失败');
          const txt = (d.data?.text || '').trim();
          if (!txt) { appendSystem('没识别到内容～'); return; }
          input.value = txt;
          input.dispatchEvent(new Event('input'));
          form.requestSubmit();
        } catch (e) { appendSystem('❌ 识别失败：' + e.message); }
        finally { micBtn.disabled = false; }
      };
      mediaRec.start();
      micBtn.textContent = '⏹️';
      micBtn.classList.add('bg-sakura-soft');
    });

    window.__CAPS = { tts: false };
    fetch('/api/me/capabilities', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.json()).then(d => { if (d?.ok) window.__CAPS = d.data || window.__CAPS; })
      .catch(() => {})
      .finally(() => Promise.all([loadCompanion(), loadDateOverview(), loadPgPoseCatalog()]).then(() => loadHistory()));
  </script>
</body>
</html>
