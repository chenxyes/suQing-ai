name: Approved AWS release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA with successful CI (40 lowercase hex characters)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            const { verifyReleaseGate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release_gate.mjs`);
            core.setOutput('sha', await verifyReleaseGate({ github, context }));
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.name }}:release-${{ needs.preflight.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.preflight.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Immutable reference
        id: reference
        env:
          IMAGE_NAME: ${{ steps.name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - name: Recheck approval configuration and CI
        uses: actions/github-script@v7
        with:
          script: |
            const { verifyReleaseGate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release_gate.mjs`);
            await verifyReleaseGate({ github, context });
      - name: Deploy approved digest
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$IMAGE" =~ ^ghcr.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/release_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/release_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          ssh_args=(-i "$HOME/.ssh/release_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          stage=".xiyu-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'rm -f "$HOME/.ssh/release_key"' EXIT
          ssh "${ssh_args[@]}" "$target" "umask 077; mkdir -p '$stage'"
          scp "${ssh_args[@]}" deploy/release.sh deploy/compose.release.yml "$target:$stage/"
          ssh "${ssh_args[@]}" "$target" "bash '$stage/release.sh' '$DEPLOY_DIR' '$IMAGE'"
          ssh "${ssh_args[@]}" "$target" "rm -rf '$stage'"
